services:
  postgres:
    image: postgres:17
    container_name: talklife_postgres
    environment:
      POSTGRES_DB: talklife_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - talklife_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./language-learning-app/backend
    container_name: talklife_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talklife_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    volumes:
    - ./language-learning-app/backend:/app
    - /app/.m2
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./language-learning-app/frontend
    container_name: talklife_frontend
    volumes:
    - ./language-learning-app/frontend:/app
    - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  talklife_postgres_data: